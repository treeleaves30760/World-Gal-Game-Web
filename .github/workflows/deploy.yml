name: Deploy site to Cloudflare

# Builds the VitePress site (docs synced from the engine repo) and deploys it
# with `wrangler deploy` (Workers static assets, see wrangler.jsonc) to
# https://world-gal-game.xn--essy41b.com/
#
# Secrets: CLOUDFLARE_API_TOKEN (Account > Workers Scripts: Edit,
# Zone > Workers Routes: Edit) and CLOUDFLARE_ACCOUNT_ID.

on:
  # A version tag in this repo
  push:
    tags: ['v*']
  # Fired by the engine repo's notify-website.yml when it is tagged
  # (client_payload.ref = the engine tag to build docs from).
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout engine repo (docs source of truth)
        uses: actions/checkout@v4
        with:
          repository: treeleaves30760/world-gal-game
          ref: ${{ github.event.client_payload.ref || 'main' }}
          path: engine

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        env:
          ENGINE_DIR: engine
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
